# ====================================================================
# Global Framework Execution Configurations
# ====================================================================

# Default local environment execution parameters (if -Denv is omitted)
default.environment=local

# Playwright Browser Setup Configurations
browser.headless=false
browser.channel=chrome

# Global Synchronization and Wait Metrics (in milliseconds)
timeout.explicit.wait=10000
timeout.page.load=30000
timeout.api.response=15000

# Centralized Automation Reporting Paths
report.output.directory=target/reports/
report.file.name=ExtentReport.html
report.document.title=E2E Automation Regression Summary Report

# Application Local Database Backup Fallbacks
# (Note: Pipelines should ideally source passwords from GitHub Secrets)
local.db.fallback.password=your_secure_local_password

# ====================================================================
# Application Environment Target URLs
# ====================================================================

# 1. Gaurav Khurana (GK) Application URLs
local.gk.targetAppUrl=https://gauravkhurana.com/practise-api/ui/index.html#/scenarios
dev.gk.targetAppUrl=https://gauravkhurana.com/practise-api/ui/index.html#/scenarios-dev
qa.gk.targetAppUrl=https://gauravkhurana.com/practise-api/ui/index.html#/scenarios
sit.gk.targetAppUrl=https://gauravkhurana.com/practise-api/ui/index.html#/scenarios
uat.gk.targetAppUrl=https://gauravkhurana.com/practise-api/ui/index.html#/scenarios

# 2. SauceDemo Shopify Application URLs
local.saucedemo.targetAppUrl=https://sauce-demo.myshopify.com/
dev.saucedemo.targetAppUrl=https://sauce-demo.myshopify.com/
qa.saucedemo.targetAppUrl=https://sauce-demo.myshopify.com/
sit.saucedemo.targetAppUrl=https://sauce-demo.myshopify.com/
uat.saucedemo.targetAppUrl=https://sauce-demo.myshopify.com/

## ====================================================================
## Practise API Application URLs
## ====================================================================
local.practiseapi.targetAppUrl=https://gauravkhurana.com/practise-api/
local.practiseapi.targetApiUrl=https://billpay-api.gauravkhurana-practice-api.workers.dev

sit.practiseapi.targetAppUrl=https://gauravkhurana.com/practise-api/
sit.practiseapi.targetApiUrl=https://billpay-api.gauravkhurana-practice-api.workers.dev

# ====================================================================
# Testcontainers Database Settings
# ====================================================================
tc.db.name=e2e_testdb

# MySQL
tc.mysql.image=mysql:8.0.36
tc.mysql.username=root
tc.mysql.password=rootpassword

# PostgreSQL
tc.postgres.image=postgres:16-alpine
tc.postgres.username=postgres
tc.postgres.password=postgres

# MS SQL Server
tc.mssql.image=mcr.microsoft.com/mssql/server:2022-latest
tc.mssql.password=StrongPassword123!

# Oracle
tc.oracle.image=gvenzl/oracle-free:23-slim-faststart
tc.oracle.username=system
tc.oracle.password=oracle

# ====================================================================
# Database Engine Toggle
# Set db.vendor=h2 for zero-Docker local runs
# Set db.vendor=mysql|postgres|sqlserver|oracle for Testcontainers CI runs
# ====================================================================
db.vendor=h2
h2.compatibility.mode=MySQL

